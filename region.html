<script>
const DATA=/*REGION_DATA*/{"heilbronn":{"lat":49.1577,"lon":9.109,"name":{"en":"Heilbronn farmland","tr":"Heilbronn tarlaları","de":"Heilbronner Land"},"near":{"en":"Leingarten, near Heilbronn, Germany","tr":"Leingarten, Heilbronn yakını, Almanya","de":"bei Leingarten, Landkreis Heilbronn"},"intro":{"en":"The farmland around Leingarten lies in the Kraichgau, a rolling loess landscape west of Heilbronn. The deep loess soils hold water well and are among the most fertile in Baden-Württemberg, but on slopes they wash away easily when they lie bare. Heilbronn is one of the warmest corners of Germany: vines grow on the hills, and arable farms grow wheat, barley, maize, sugar beet for the Südzucker factory in Offenau, and rapeseed.","tr":"Leingarten çevresindeki tarlalar, Heilbronn'un batısındaki dalgalı lös arazisi Kraichgau'da. Derin lös topraklar suyu iyi tutar ve Baden-Württemberg'in en verimlileri arasındadır, ama yamaçlarda çıplak kaldıklarında kolayca akıp giderler. Heilbronn Almanya'nın en sıcak köşelerinden biri: tepelerde bağlar var, tarlalarda buğday, arpa, mısır, Offenau'daki Südzucker fabrikası için şeker pancarı ve kanola yetişir.","de":"Die Felder um Leingarten liegen im Kraichgau, einer welligen Lösslandschaft westlich von Heilbronn. Die tiefen Lössböden speichern Wasser gut und gehören zu den fruchtbarsten in Baden-Württemberg, werden an Hängen aber leicht abgeschwemmt, wenn sie offen liegen. Heilbronn ist eine der wärmsten Ecken Deutschlands: An den Hängen wächst Wein, auf den Äckern Weizen, Gerste, Mais, Zuckerrüben für das Südzucker-Werk in Offenau und Raps."},"risks":{"en":["Soil erosion on bare loess after heavy summer storms. Keep the soil covered, work across the slope, use mulch sowing or cover crops.","Dry springs and heat during flowering are more common: hot days have almost tripled since the late 1980s.","Crops start earlier, but frost in April still happens.","Wet harvest weeks can lower grain quality."],"tr":["Yaz sağanaklarından sonra çıplak löste toprak erozyonu. Toprağı örtülü tut, eğime dik işle, malçlı ekim ya da örtü bitkisi kullan.","Kurak ilkbaharlar ve çiçeklenmede sıcak daha sık: sıcak gün sayısı 1980'lerin sonundan bu yana neredeyse üç katına çıktı.","Ürünler daha erken başlıyor, ama nisanda don hâlâ oluyor.","Yağışlı hasat haftaları tane kalitesini düşürebilir."],"de":["Bodenerosion auf offenem Löss nach Sommergewittern. Boden bedeckt halten, quer zum Hang arbeiten, Mulchsaat oder Zwischenfrüchte nutzen.","Trockene Frühjahre und Hitze zur Blüte werden häufiger: Die Hitzetage haben sich seit Ende der 1980er fast verdreifacht.","Die Kulturen starten früher, Frost im April gibt es aber weiterhin.","Nasse Erntewochen können die Kornqualität mindern."]},"contacts":{"en":["Landwirtschaftsamt at the Landratsamt Heilbronn (district farm office)","LTZ Augustenberg, Baden-Württemberg's agricultural research centre","German Weather Service agricultural weather: dwd.de/agrarwetter","Plant protection information: isip.de"],"tr":["Landratsamt Heilbronn bünyesindeki Landwirtschaftsamt (ilçe tarım dairesi)","LTZ Augustenberg, Baden-Württemberg tarım araştırma merkezi","Alman Meteoroloji Servisi tarım hava durumu: dwd.de/agrarwetter","Bitki koruma bilgileri: isip.de"],"de":["Landwirtschaftsamt beim Landratsamt Heilbronn","LTZ Augustenberg, landwirtschaftliches Technologiezentrum Baden-Württemberg","Agrarwetter des Deutschen Wetterdienstes: dwd.de/agrarwetter","Pflanzenschutz-Informationen: isip.de"]},"rules":{"en":["EU rule GAEC 6 (soil cover): in Germany most arable land must be covered over winter, from 15 November to 15 January, for example by a cover crop or stubble.","EU rule GAEC 7 (crop rotation): the main crop on a field has to change regularly; Germany sets the details and exemptions.","EU rule GAEC 5 (erosion): fields in the erosion risk classes CCWasser 1 and 2, common on Kraichgau and Danube loess, have limits on ploughing.","Fertiliser Ordinance (Düngeverordnung): calculate the nitrogen need before fertilising; in nitrate 'red areas' only 80 % of that need may be applied.","Irrigation from wells or rivers needs a permit from the district water authority."],"tr":["AB kuralı GAEC 6 (toprak örtüsü): Almanya'da tarım arazisinin çoğu 15 Kasım ile 15 Ocak arasında örtülü olmalı, örneğin örtü bitkisi ya da anızla.","AB kuralı GAEC 7 (ürün rotasyonu): bir tarladaki ana ürün düzenli olarak değişmeli; ayrıntıları ve istisnaları Almanya belirler.","AB kuralı GAEC 5 (erozyon): Kraichgau ve Tuna lösünde sık görülen CCWasser 1 ve 2 erozyon risk sınıflarındaki tarlalarda pulluk kullanımı sınırlıdır.","Gübre Yönetmeliği (Düngeverordnung): gübrelemeden önce azot ihtiyacını hesapla; nitrat 'kırmızı bölgelerinde' bu ihtiyacın sadece %80'i verilebilir.","Kuyudan ya da dereden sulama için ilçe su idaresinden izin gerekir."],"de":["EU-Regel GLÖZ 6 (Bodenbedeckung): In Deutschland muss der größte Teil des Ackerlands vom 15. November bis 15. Januar bedeckt sein, zum Beispiel durch Zwischenfrucht oder Stoppeln.","EU-Regel GLÖZ 7 (Fruchtwechsel): Die Hauptkultur eines Schlags muss regelmäßig wechseln; Einzelheiten und Ausnahmen regelt Deutschland.","EU-Regel GLÖZ 5 (Erosion): Für Schläge der Erosionsgefährdungsklassen CCWasser 1 und 2, häufig auf Löss im Kraichgau und an der Donau, gilt eine eingeschränkte Pflugnutzung.","Düngeverordnung: Vor dem Düngen den Stickstoffbedarf ermitteln; in roten Gebieten dürfen nur 80 % dieses Bedarfs gedüngt werden.","Beregnung aus Brunnen oder Gewässern braucht eine wasserrechtliche Erlaubnis der Unteren Wasserbehörde."]},"euPrices":false,"calendar":{"wheat":[[10],[7,8]],"barley":[[9,10],[7]],"maize":[[4,5],[10]],"sugarbeet":[[3,4],[9,10,11]],"rapeseed":[[8,9],[7]]},"climate":{"normal":{"t":9.4,"rain":776.9,"rainAS":415.7,"frost":98.7,"ice":15,"summer":48.5,"hot":10.9,"heavy":2.2,"dry":14,"gdd":2108.4,"ffree":192.0,"lf":108,"ff":300},"then":{"t":8.8,"rain":823.5,"rainAS":441.9,"frost":103.9,"ice":17.7,"summer":38.5,"hot":6.4,"heavy":3.2,"dry":12.8 ":{"en":"Thrace, the European part of Türkiye, is the country's leading sunflower region and grows high-yield wheat. Winters are mild and wet, summers long and dry. Most fields are rain-fed, and water for irrigation is limited.","tr":"Türkiye'nin Avrupa yakası Trakya, ülkenin başlıca ayçiçeği bölgesi ve verimli buğday yetiştirir. Kışlar ılık ve yağışlı, yazlar uzun ve kurak. Tarlaların çoğu yağmura bağlı ve sulama suyu sınırlı.","de":"Thrakien, der europäische Teil der Türkei, ist die wichtigste Sonnenblumenregion des Landes und baut ertragreichen Weizen an. Die Winter sind mild und nass, die Sommer lang und trocken. Die meisten Felder sind Regenfeldbau, Wasser zur Beregnung ist knapp."},"risks":{"en":["A dry spring cuts wheat yields.","Long summer dry spells and heat during sunflower flowering.","Heavy autumn rain on freshly sown, bare fields.","Soil organic matter declines in a plain wheat and sunflower rotation."],"tr":["Kurak ilkbahar buğday verimini düşürür.","Uzun yaz kuraklığı ve ayçiçeği çiçeklenirken sıcak.","Yeni ekilmiş çıplak tarlalara sonbahar sağanakları.","Sadece buğday ve ayçiçeği dönüşümünde topraktaki organik madde azalır."],"de":["Ein trockenes Frühjahr senkt die Weizenerträge.","Lange Trockenphasen und Hitze zur Sonnenblumenblüte.","Starkregen im Herbst auf frisch gesäten, offenen Feldern.","Die organische Substanz nimmt in einer reinen Weizen-Sonnenblumen-Folge ab."]},"contacts":{"en":["Tekirdağ Provincial Directorate of Agriculture and Forestry","Trakya Agricultural Research Institute, Edirne","Turkish State Meteorological Service, agricultural weather: mgm.gov.tr","Turkish Grain Board purchase prices: tmo.gov.tr"],"tr":["Tekirdağ İl Tarım ve Orman Müdürlüğü","Trakya Tarımsal Araştırma Enstitüsü, Edirne","Meteoroloji Genel Müdürlüğü zirai meteoroloji: mgm.gov.tr","TMO alım fiyatları: tmo.gov.tr"],"de":["Provinzdirektion für Landwirtschaft und Forsten Tekirdağ","Agrarforschungsinstitut Thrakien, Edirne","Türkischer Wetterdienst, Agrarwetter: mgm const CROPN={en:{wheat:"Winter wheat",barley:"Winter barley",maize:"Grain maize",sugarbeet:"Sugar beet",rapeseed:"Winter rapeseed",sunflower:"Sunflower",soybean:"Soybean"},
 tr:{wheat:"Kışlık buğday",barley:"Kışlık arpa",maize:"Dane mısır",sugarbeet:"Şeker pancarı",rapeseed:"Kışlık kanola",sunflower:"Ayçiçeği",soybean:"Soya"},
 de:{wheat:"Winterweizen",barley:"Wintergerste",maize:"Körnermais",sugarbeet:"Zuckerrübe",rapeseed:"Winterraps",sunflower:"Sonnenblume",soybean:"Sojabohne"}};
const MON={en:"J F M A M J J A S O N D",tr:"O Ş M N M H T A E E K A",de:"J F M A M J J A S O N D"};
const q=new URLSearchParams(location.search), KEY=DATA[q.get('r')]?q.get('r'):'heilbronn';
let LANG=I18N[q.get('lang')]?q.get('lang'):'en';
try{if(!q.get('lang')){const s=localStorage.getItem('rotasat_lang');if(s&&I18N[s])LANG=s;}}catch(e){}
const $=id=>document.getElementById(id);
const t=(k,v)=>{let s=I18N[LANG][k]??I18N.en[k]??k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s;};
const loc=()=>LANG==='en'?'en-GB':LANG==='de'?'de-DE':'tr-TR';
const nf=(n,d=0)=>(+n).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>{const m=n<0?'−':'';return LANG==='en'?m+'€'+nf(Math.abs(n)):m+nf(Math.abs(n))+' €';};
const day=d=>d==null?'–':new Date(Date.UTC(2001,0,d)).toLocaleDateString(loc(),{day:'numeric',month:'long'});
function render(){
  const R=DATA[KEY], C=R.climate, N=C.normal, B=C.now, A=C.then, M=R.model;
  document.documentElement.lang=LANG; document.title='RotaSat: '+R.name[LANG];
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG));
  $('backLink').textContent=t('back'); $('kicker').textContent=t('kicker')+', '+R.near[LANG]; $('title').textContent=R.name[LANG]; $('intro').textContent=R.intro[LANG];
  const plan=`index.html#lat=${R.lat}&lon=${R.lon}&site=${KEY}&lang=${LANG}`; $('planLink').textContent=t('plan'); $('planLink').href=plan; $('backLink').href=plan;
  ['h_glance','s_glance','h_months','s_months','c_months','h_change','s_change','n_change','h_2050','s_2050','c_2050','h_crops','s_crops','l_sow','l_grow','l_harv','n_crops','h_sat','h_risks','h_rules','n_rules','h_ask','foot'].forEach(k=>$(k).textContent=t(k));
  // at a glance
  const card=(l,v,n)=>`<div><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
  $('cards').innerHTML=[
    card(t('c_rain'),nf(N.rain)+' mm',t('n_normal')+'. '+t('n_now',{v:nf(B.rain)+' mm'})),
    card(t('c_t'),nf(N.t,1)+' °C',t('n_normal')+'. '+t('n_now',{v:nf(B.t,1)+' °C'})),
    card(t('c_ffree'),nf(N.ffree),t('n_normal')+'. '+t('n_now',{v:nf(B.ffree)})),
    card(t('c_gdd'),nf(N.gdd),t('gdd_n')),
    card(t('c_hot'),nf(N.hot),t('n_normal')+'. '+t('n_now',{v:nf(B.hot)})),
    card(t('c_dry'),t('days',{v:nf(N.dry)}),t('n_normal')+'. '+t('n_now',{v:t('days',{v:nf(B.dry)})})),
    card(t('c_lf'),day(N.lf),t('n_normal')+'. '+t('n_now',{v:day(B.lf)})),
    card(t('c_ff'),day(N.ff),t('n_normal')+'. '+t('n_now',{v:day(B.ff)}))].join('');
  // climograph
  const mo=C.months, W=900,H=300,L=46,Rr=46,T=16,Bm=30, pmax=Math.ceil(Math.max(...mo.p)/20)*20, tmin=Math.floor(Math.min(...mo.tn)/5)*5, tmax=Math.ceil(Math.max(...mo.tx)/5)*5;
  const X=i=>L+(i+0.5)*(W-L-Rr)/12, bw=(W-L-Rr)/12*0.6, YP=v=>T+(1-v/pmax)*(H-T-Bm), YT=v=>T+(tmax-v)/(tmax-tmin)*(H-T-Bm), ML=MON[LANG].split(' ');
  let g=''; for(let v=0;v<=pmax;v+=pmax/4) g+=`<line x1="${L}" x2="${W-Rr}" y1="${YP(v)}" y2="${YP(v)}" stroke="#E6E9ED"/><text x="${L-6}" y="${YP(v)+4}" font-size="12" text-anchor="end" fill="#2491FF">${nf(v)}</text>`;
  for(let v=tmin;v<=tmax;v+=5) g+=`<text x="${W-Rr+6}" y="${YT(v)+4}" font-size="12" fill="#C41C06">${v}</text>`;
  const bars=mo.p.map((v,i)=>`<rect x="${X(i)-bw/2}" y="${YP(v)}" width="${bw}" height="${YP(0)-YP(v)}" fill="#9cc3e8"><title>${ML[i]}: ${nf(v)} mm</title></rect>`).join('');
  const band=`<polygon points="${mo.tx.map((v,i)=>X(i)+','+YT(v)).join(' ')} ${mo.tn.map((v,i)=>X(i)+','+YT(v)).reverse().join(' ')}" fill="#C41C06" opacity=".12"/>`;
  const line=`<polyline points="${mo.t.map((v,i)=>X(i)+','+YT(v)).join(' ')}" fill="none" stroke="#C41C06" stroke-width="2.5"/>`+mo.t.map((v,i)=>`<circle cx="${X(i)}" cy="${YT(v)}" r="3" fill="#C41C06"><title>${nf(v,1)} °C</title></circle>`).join('');
  const zero=tmin<0?`<line x1="${L}" x2="${W-Rr}" y1="${YT(0)}" y2="${YT(0)}" stroke="#C41C06" stroke-dasharray="3 3" opacity=".5"/>`:'';
  const xl=ML.map((m,i)=>`<text x="${X(i)}" y="${H-10}" font-size="13" text-anchor="middle" fill="#383b52">${m}</text>`).join('');
  $('climo').innerHTML=`<svg role="img" aria-label="${t('h_months')}" viewBox="0 0 ${W} ${H}">${g}${bars}${band}${zero}${line}${xl}<text x="${L}" y="11" font-size="12" fill="#2491FF">${t('rain_mm')}</text><text x="${W-Rr}" y="11" font-size="12" text-anchor="end" fill="#C41C06">${t('temp_c')}</text></svg>`;
  // then and now
  const rows=[['t',1,1,' °C'],['rain',-1,0,' mm'],['rainAS',-1,0,' mm'],['frost',0,0,''],['ice',0,0,''],['summer',1,0,''],['hot',1,0,''],['heavy',1,1,''],['dry',1,0,''],['gdd',0,0,''],['ffree',0,0,''],['lf',1,0,'d'],['ff',0,0,'d']];
  $('chg').innerHTML=`<thead><tr><th style="padding-left:0">${t('ch_what')}</th><th class="r">1985-1994</th><th class="r">2015-2024</th><th class="r">${t('ch_change')}</th></tr></thead><tbody>`+rows.map(([k,bad,dec,u])=>{
    const a=A[k], b=B[k]; if(a==null||b==null) return '';
    const d=b-a, eps=k==='t'?0.05:(u==='d'?1:Math.max(0.5,Math.abs(a)*0.03)), dir=Math.abs(d)<eps?0:Math.sign(d), cls=!dir||!bad?'eq':(dir===bad?'worse':'better');
    const f=v=>u==='d'?day(v):nf(v,dec)+u;
    const dt=u==='d'?(dir?t(d<0?'earlier':'later',{n:nf(Math.abs(d))}):t('same')):(dir?(d>0?'+':'−')+nf(Math.abs(d),dec)+u:t('same'));
    return `<tr><td style="padding-left:0">${t('r_'+k)}</td><td class="r v">${f(a)}</td><td class="r v">${f(b)}</td><td class="r ${cls}">${dt}</td></tr>`;}).join('')+'</tbody>';
  // 2050 by month
  const c45=M.cm45, c85=M.cm85, fx=$('fut');
  if(!c45){fx.textContent='–';} else {
    const H2=260, mid=110, tm=Math.max(2,...c85.dT), pm=Math.max(20,...c45.dP.map(Math.abs),...c85.dP.map(Math.abs));
    const YtT=v=>mid-10-(v/tm)*(mid-30), YpP=v=>H2-60-(v/pm)*45;
    let s=`<text x="${L}" y="14" font-size="13" fill="#383b52" font-weight="700">${t('t_row')}</text><line x1="${L}" x2="${W-Rr}" y1="${YtT(0)}" y2="${YtT(0)}" stroke="#c3c8d8"/>`;
    s+=c45.dT.map((v,i)=>`<rect x="${X(i)-bw/2}" y="${YtT(v)}" width="${bw}" height="${YtT(0)-YtT(v)}" fill="#E8862A"><title>${ML[i]}: +${nf(v,1)} °C</title></rect><text x="${X(i)}" y="${YtT(v)-5}" font-size="11" text-anchor="middle" fill="#383b52">+${nf(v,1)}</text>`).join('');
    s+=c85.dT.map((v,i)=>`<circle cx="${X(i)}" cy="${YtT(v)}" r="4" fill="#C41C06"><title>SSP5-8.5: +${nf(v,1)} °C</title></circle>`).join('');
    s+=`<text x="${L}" y="${H2-118}" font-size="13" fill="#383b52" font-weight="700">${t('p_row')}</text><line x1="${L}" x2="${W-Rr}" y1="${YpP(0)}" y2="${YpP(0)}" stroke="#c3c8d8"/>`;
    s+=c45.dP.map((v,i)=>`<rect x="${X(i)-bw/2}" y="${Math.min(YpP(v),YpP(0))}" width="${bw}" height="${Math.max(1,Math.abs(YpP(v)-YpP(0)))}" fill="${v<0?'#C9A227':'#2491FF'}"><title>${ML[i]}: ${v>0?'+':''}${nf(v)} %</title></rect><text x="${X(i)}" y="${v<0?YpP(v)+13:YpP(v)-4}" font-size="11" text-anchor="middle" fill="#383b52">${v>0?'+':''}${nf(v)}</text>`).join('');
    s+=c85.dP.map((v,i)=>`<circle cx="${X(i)}" cy="${YpP(v)}" r="3.5" fill="#151622" opacity=".7"><title>SSP5-8.5: ${v>0?'+':''}${nf(v)} %</title></circle>`).join('');
    s+=ML.map((m,i)=>`<text x="${X(i)}" y="${H2-4}" font-size="13" text-anchor="middle" fill="#383b52">${m}</text>`).join('');
    fx.innerHTML=`<svg role="img" aria-label="${t('h_2050')}" viewBox="0 0 ${W} ${H2}">${s}</svg>`;
  }
  // crops and calendar
  const cal=R.calendar, MLm=MON[LANG].split(' ');
  $('cal').innerHTML=`<thead><tr><th style="padding-left:0">${t('th_crop')}</th>${MLm.map(m=>`<th class="m">${m}</th>`).join('')}<th class="r">${t('th_yield')}</th><th class="r">${t('th_today')}</th><th class="r">${t('th_long')}</th></tr></thead><tbody>`+
    Object.entries(cal).map(([k,[sow,harv]])=>{
      const grow=new Set(); let m=sow.at(-1); while(true){m=m%12+1; if(harv.includes(m)) break; grow.add(m); if(grow.size>12) break;}
      const cells=[...Array(12)].map((_,i)=>{const mm=i+1;return `<td class="mc"><span style="display:block;height:20px;border-radius:2px;background:${sow.includes(mm)?'#2E7D32':harv.includes(mm)?'#C9A227':grow.has(mm)?'#cfe3c7':'#eef0f6'}"></span></td>`;}).join('');
      const c=M.crops[k]; const unit=k==='sugarbeet'?' t/ha':' t/ha';
      return `<tr><td style="padding-left:0"><b>${CROPN[LANG][k]}</b></td>${cells}<td class="r v">${c?nf(c.y,1)+unit:'–'}</td><td class="r v">${c?money(c.mToday):'–'}</td><td class="r v">${c?money(c.mLong):'–'}</td></tr>`;}).join('')+'</tbody>';
  $('euWarn').innerHTML=R.euPrices?`<p class="warn">${t('eu_warn')}</p>`:'';
  // satellite
  if(R.s2){const seq=Object.entries(R.s2.season).map(([y,s])=>`${y} ${t('sp_'+s)}`).join(', '); $('s_sat').textContent=t('s_sat',{b:nf(R.s2.bare),seq});} else $('satSec').hidden=true;
  $('risks').innerHTML=R.risks[LANG].map(x=>`<li>${x}</li>`).join('');
  $('rules').innerHTML=R.rules[LANG].map(x=>`<li>${x}</li>`).join('');
  $('contacts').innerHTML=R.contacts[LANG].map(x=>`<li>${x}</li>`).join('');
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;try{localStorage.setItem('rotasat_lang',LANG);}catch(e){};const u=new URL(location.href);u.searchParams.set('lang',LANG);history.replaceState(null,'',u);render();});
render();
</script>
